{{- $v := .Values -}}
{{- $image := printf "%s:%s" $v.image.repository (default .Chart.AppVersion $v.image.tag) -}}
{{- if not (has $v.collector.mode (list "grpc" "poll-lldp")) -}}
  {{- fail "collector.mode must be grpc or poll-lldp" -}}
{{- end -}}
{{- $selector := $v.nodeSelector -}}
{{- if not (or (kindIs "map" $selector) (and (kindIs "slice" $selector) (empty $selector)) (eq $selector nil)) -}}
  {{- fail "nodeSelector must be a label map or []" -}}
{{- end -}}
{{- range $key, $value := $selector -}}
  {{- if not (kindIs "string" $value) -}}{{- fail (printf "nodeSelector[%s] must be a string" $key) -}}{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name | quote }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  {{- with $v.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
      {{- with $v.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      hostNetwork: {{ $v.hostNetwork }}
      hostPID: {{ $v.hostPID }}
      hostIPC: {{ $v.hostIPC }}
      dnsPolicy: {{ default (ternary "ClusterFirstWithHostNet" "ClusterFirst" $v.hostNetwork) $v.dnsPolicy | quote }}
      automountServiceAccountToken: {{ $v.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ $v.terminationGracePeriodSeconds }}
      {{- with $selector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with $v.serviceAccountName }}
      serviceAccountName: {{ . | quote }}
      {{- end }}
      {{- range $field := list "affinity" "tolerations" "dnsConfig" "imagePullSecrets" }}
      {{- with index $v $field }}
      {{ $field }}:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      securityContext:
        {{- toYaml $v.podSecurityContext | nindent 8 }}
      containers:
        - name: lldpd
          image: {{ $image | quote }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          command: ["/usr/sbin/lldpd"]
          args: ["-r", "-dd", "-I", {{ default "en*" $v.interfaceName | quote }}, "-u", "/run/lldpd/lldpd.socket", "-p", "/run/lldpd/lldpd.pid"]
          securityContext:
            {{- toYaml $v.lldpd.securityContext | nindent 12 }}
          resources:
            {{- toYaml (ternary $v.resources $v.lldpd.resources (eq $v.lldpd.resources nil)) | nindent 12 }}
          volumeMounts:
            - name: control
              mountPath: /run/lldpd
        - name: collector
          image: {{ $image | quote }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          args:
            - "-socket"
            - /run/lldpd/lldpd.socket
            - "-timeout"
            - {{ $v.collector.timeout | quote }}
            {{- if eq $v.collector.mode "grpc" }}
            - "--grpc-listen"
            - {{ required "collector.grpcListen is required in grpc mode" $v.collector.grpcListen | quote }}
            {{- else }}
            - "--poll-lldp"
            - "-interval"
            - {{ $v.collector.interval | quote }}
            - "--verbose"
            - {{ $v.collector.verbose | quote }}
            {{- end }}
            {{- if ne $v.collector.lldpcli "lldpcli" }}
            - "-lldpcli"
            - {{ $v.collector.lldpcli | quote }}
            {{- end }}
            {{- with $v.interfaceName }}
            - "-iface"
            - {{ . | quote }}
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            {{- toYaml $v.collector.securityContext | nindent 12 }}
          resources:
            {{- toYaml (ternary $v.resources $v.collector.resources (eq $v.collector.resources nil)) | nindent 12 }}
          volumeMounts:
            - name: control
              mountPath: /run/lldpd
              readOnly: true
      volumes:
        - name: control
          emptyDir:
            {{- toYaml $v.controlVolume | nindent 12 }}
